{% extends "base.html" %}
{% block title %}Calculation Result{% endblock %}
{% block content %}
    <h1>Calculation Result for {{ filename }}</h1>
    <ul>
        <li>Volume: {{ "%.2f"|format(volume) }} cm³</li>
        <li>Weight: {{ "%.2f"|format(weight) }} g</li>
        <li>Estimated Cost: ${{ "%.2f"|format(cost) }}</li>
    </ul>
{% endblock %}
