{% extends "base.html" %}
{% block title %}Consumer Calculator{% endblock %}
{% block content %}
    <h1>Consumer 3D Print Calculator</h1>
    <form action="/upload" method="post" enctype="multipart/form-data">
        <label for="filament">Filament Type:</label>
        <select name="filament" id="filament">
            {% for filament in filaments %}
                <option value="{{ filament }}">{{ filament }}</option>
            {% endfor %}
        </select>
        <button type="button" id="lookup_price">Look up average price</button>
        <br>

        <input type="radio" id="average_cost" name="cost_source" value="average" checked>
        <label for="average_cost">Use Average Market Price</label><br>

        <input type="radio" id="custom_cost_radio" name="cost_source" value="custom">
        <label for="custom_cost_radio">Enter Custom Cost ($/kg):</label>
        <input type="number" step="0.01" name="custom_cost" id="custom_cost_input" disabled>
        <br>

        <label for="file">Upload your 3D model:</label>
        <input type="file" name="file" id="file">
        <input type="submit" value="Upload">
    </form>
    <script>
        const customCostRadio = document.getElementById('custom_cost_radio');
        const customCostInput = document.getElementById('custom_cost_input');
        const averageCostRadio = document.getElementById('average_cost');
        const lookupPriceButton = document.getElementById('lookup_price');
        const filamentSelect = document.getElementById('filament');

        customCostRadio.addEventListener('change', () => {
            if (customCostRadio.checked) {
                customCostInput.disabled = false;
            }
        });

        averageCostRadio.addEventListener('change', () => {
            if (averageCostRadio.checked) {
                customCostInput.disabled = true;
            }
        });

        lookupPriceButton.addEventListener('click', () => {
            const filamentType = filamentSelect.value;
            fetch(`/lookup_price?filament=${filamentType}`)
                .then(response => response.json())
                .then(data => {
                    customCostInput.value = data.price;
                    customCostRadio.checked = true;
                    customCostInput.disabled = false;
                });
        });
    </script>
{% endblock %}
